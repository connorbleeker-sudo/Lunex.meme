<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lunex tab icon: the orange orb from the logo, on a dark rounded tile so it reads on light and dark tab bars -->
  <defs>
    <radialGradient id="orb" cx="36%" cy="32%" r="68%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#ffd2b8"/>
      <stop offset=".5" stop-color="#ff6a2b"/>
      <stop offset=".85" stop-color="#7a2408"/>
      <stop offset="1" stop-color="#2a0a02"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#ff6a2b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b0b10"/>
  <circle cx="32" cy="32" r="27" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="18" fill="url(#orb)"/>
  <circle cx="38.5" cy="37" r="2.6" fill="#000" opacity=".18"/>
  <circle cx="27" cy="40" r="1.8" fill="#000" opacity=".14"/>
</svg>
